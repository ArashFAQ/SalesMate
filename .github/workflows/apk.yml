name: Build APK
on:
  push:
    branches: [apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web app (latest main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: web
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare www
        run: |
          mkdir -p www
          cp -a web/. www/
          rm -rf www/.git www/.github www/SUPABASE_MOBILE.sql www/README.md
          grep -m1 APP_VERSION www/js/core.js || true
      - run: npm install
      - run: npx cap add android
      - name: Icons
        run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Native updater plugin, install permission, versionCode
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR=android/app/src/main/java/$(echo "$APPID" | tr . /)
          ls "$DIR"
          sed "s/__PKG__/$APPID/g" native/ApkUpdater.java.tpl > "$DIR/ApkUpdater.java"
          sed "s/__PKG__/$APPID/g" native/MainActivity.java.tpl > "$DIR/MainActivity.java"
          VER=$(grep -m1 -oE "APP_VERSION = '[0-9.]+'" www/js/core.js | grep -oE "[0-9.]+")
          IFS=. read MA MI PA <<< "$VER"
          CODE=$((MA*10000 + MI*100 + PA))
          echo "versionName $VER versionCode $CODE"
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission\|fileprovider" android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/res/xml/file_paths.xml
      - name: Stable signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          blk = ("signingConfigs {\n        debug {\n            storeFile file(\"${rootDir}/../debug.keystore\")\n"
                 "            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n    ")
          assert 'signingConfigs' not in s
          s = s.replace('buildTypes {', blk + 'buildTypes {', 1)
          open(p, 'w').write(s)
          PY
          grep -n -A6 "signingConfigs" android/app/build.gradle
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify signing key
        run: |
          mkdir -p chk && unzip -o -q android/app/build/outputs/apk/debug/app-debug.apk 'META-INF/*.RSA' -d chk
          keytool -printcert -file chk/META-INF/CERT.RSA | tee cert.txt
          grep -q "CN=SalesMate" cert.txt
      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SalesMate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SalesMate-apk
          path: SalesMate.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          VER=$(grep -m1 -oE "APP_VERSION = '[0-9.]+'" www/js/core.js | grep -oE "[0-9.]+")
          gh release create apk-latest SalesMate.apk --title "SalesMate APK" \
            --notes "آخرین نسخه‌ی APK از وب‌اپ SalesMate (ساخته‌شده از شاخه main). SM_VERSION=$VER"
